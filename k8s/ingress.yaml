# TLS terminé par Traefik (cert-manager), comme Pelagoss/chess-analyzer.
# Le domaine doit correspondre à CC_PUBLIC_URL (config.yaml) et à
# COMPANION_SERVER (app/build.secrets.env).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-companion
  namespace: claude-companion
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: agentchi.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 80
  tls:
    - hosts:
        - agentchi.dev
      secretName: agentchi-letsencrypt
