# TLS terminé par Traefik (cert-manager), comme Pelagoss/chess-analyzer.
# Le domaine doit correspondre à CC_PUBLIC_URL (config.yaml) et à
# COMPANION_SERVER (app/build.secrets.env). L'ancien domaine claude-companion.codingpacer.fr
# reste servi le temps que les plugins et hooks cloud passent au nouveau.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-companion
  namespace: claude-companion
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: agentchi.codingpacer.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 80
    - host: claude-companion.codingpacer.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 80
  tls:
    - hosts:
        - agentchi.codingpacer.fr
        - claude-companion.codingpacer.fr
      secretName: agentchi-letsencrypt
