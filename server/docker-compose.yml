# Serveur Claude Companion + Caddy (HTTPS automatique avec Let's Encrypt).
#   CC_DOMAIN=cc.example.fr docker compose up -d
# Le nom de domaine doit pointer vers ce serveur, ports 80 et 443 ouverts.
services:
  companion:
    build: .
    restart: unless-stopped
    environment:
      CC_PUBLIC_URL: https://${CC_DOMAIN:?définis CC_DOMAIN, par ex. cc.example.fr}
      CC_TRUST_PROXY: "true"
    volumes:
      - companion-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CC_DOMAIN: ${CC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - companion

volumes:
  companion-data:
  caddy-data:
