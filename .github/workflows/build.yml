name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Vérification des scripts de hook
        run: |
          shellcheck hooks/*.sh
          cmp hooks/claude-companion-notify.sh .claude/hooks/claude-companion-notify.sh \
            || { echo "Relancer ./hooks/install.sh --project ."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: claude-companion-debug
          path: app/build/outputs/apk/debug/*.apk
