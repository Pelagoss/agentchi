name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Seule une PR venant d'un fork n'a pas accès aux secrets : elle compile un APK
      # sans Firebase. Partout ailleurs, l'absence de DECRYPTING_KEY fait échouer le build.
      FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Sops
        if: env.FROM_FORK != 'true'
        uses: mdgreenwald/mozilla-sops-action@v2.0.0
        with:
          version: 'latest'

      # Projet Firebase (FIREBASE_*) et serveur par défaut (COMPANION_SERVER),
      # chiffrés dans app/build.secrets.env, exportés pour Gradle (app/build.gradle.kts).
      - name: Variables de build (sops)
        if: env.FROM_FORK != 'true'
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "::error::Secret DECRYPTING_KEY absent : ajoute la clé privée age dans Settings › Secrets and variables › Actions › Repository secrets."
            exit 1
          fi
          vars="$(sops decrypt app/build.secrets.env)"
          for name in FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID COMPANION_SERVER; do
            value="$(sed -n "s/^$name=//p" <<<"$vars")"
            if [ -z "$value" ] || [ "$value" = "A_REMPLACER" ]; then
              echo "::error::$name manquant dans app/build.secrets.env (sops edit app/build.secrets.env)."
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "Projet Firebase : $(sed -n 's/^FIREBASE_PROJECT_ID=//p' <<<"$vars")"
        env:
          # Clé privée réservée à cette étape : Gradle et ses dépendances ne la voient pas.
          SOPS_AGE_KEY: ${{ secrets.DECRYPTING_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compilation de l'APK montre
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build de publication (AAB non signé, vérifie R8)
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Vérification du plugin Claude Code
        run: jq empty .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json

      - name: Renommage de l'APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/claude-companion-montre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: claude-companion-debug
          path: apk/*.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet et tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Image Docker
        run: docker build -t claude-companion-server .
