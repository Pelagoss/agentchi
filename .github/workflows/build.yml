name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Clé age de sops (même secret que pour le déploiement). Absente (PR d'un
      # fork) : l'APK est construit sans Firebase et ne reçoit aucun push.
      HAS_SOPS_KEY: ${{ secrets.DECRYPTING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Sops
        if: env.HAS_SOPS_KEY == 'true'
        uses: mdgreenwald/mozilla-sops-action@v2.0.0
        with:
          version: 'latest'

      # Projet Firebase (FIREBASE_*) et serveur par défaut (COMPANION_SERVER),
      # chiffrés dans app/build.secrets.env, exportés pour Gradle (app/build.gradle.kts).
      # Les valeurs encore à remplacer sont ignorées.
      - name: Variables de build (sops)
        if: env.HAS_SOPS_KEY == 'true'
        run: |
          vars="$(sops decrypt app/build.secrets.env)"
          grep -v '=A_REMPLACER$' <<<"$vars" >> "$GITHUB_ENV" || true
        env:
          # Clé privée réservée à cette étape : Gradle et ses dépendances ne la voient pas.
          SOPS_AGE_KEY: ${{ secrets.DECRYPTING_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compilation de l'APK montre
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build de publication (AAB non signé, vérifie R8)
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Vérification du plugin Claude Code
        run: jq empty .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json

      - name: Renommage de l'APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/claude-companion-montre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: claude-companion-debug
          path: apk/*.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet et tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Image Docker
        run: docker build -t claude-companion-server .
