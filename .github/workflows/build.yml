name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew --no-daemon :app:testDebugUnitTest :phone:testDebugUnitTest

      - name: Compilation des APK (montre + téléphone)
        run: ./gradlew --no-daemon :app:assembleDebug :phone:assembleDebug

      - name: Build de publication (AAB non signés, vérifie R8)
        run: ./gradlew --no-daemon :app:bundleRelease :phone:bundleRelease

      - name: Vérification des scripts de hook
        run: shellcheck hooks/*.sh

      - name: Renommage des APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/claude-companion-montre.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk apk/claude-companion-telephone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: claude-companion-debug
          path: apk/*.apk
