# Build de l'image du serveur (server/Dockerfile), push sur le registry Harbor,
# puis déploiement des manifests k8s/. Même chaîne que Pelagoss/chess-analyzer.
name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Sérialise les déploiements d'une même ref (sans en interrompre un en cours).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: harbor.codingpacer.fr
  IMAGE: harbor.codingpacer.fr/prod/agentchi-server
  # Nom technique d'origine : le volume (state.json) et le Secret chiffré y sont rattachés.
  NAMESPACE: claude-companion
  # Push de tag → la version (ex. 1.2.3) ; sinon nom de branche + sha.
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}{1}', github.ref_name, github.sha) }}
  GODEBUG: http2client=0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push server
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-kubectl@v5

      - uses: azure/k8s-set-context@v5
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # Idempotent : crée le namespace au premier déploiement seulement.
      - name: Ensure namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ secrets.REGISTRY_USERNAME }}
          container-registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          secret-name: registry-secret

      - name: Install Sops
        uses: mdgreenwald/mozilla-sops-action@v2.0.0
        with:
          version: 'latest'

      - name: Decrypt secrets
        run: find k8s -name '*.secrets.yaml' | xargs -I % sh -c 'sops decrypt % -i'
        shell: bash
        env:
          SOPS_AGE_KEY: '${{ secrets.DECRYPTING_KEY }}'

      - name: Apply Manifests
        uses: azure/k8s-deploy@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          action: deploy
          manifests: |
            k8s
          images: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          imagepullsecrets: |
            registry-secret
